openapi: 3.0.3
security:
  - bearerAuth: []
info:
  title: API de Gestión de Inventarios (Versión Mejorada)
  description: |
    API RESTful para la gestión de inventarios y productos.
    Permite crear, consultar, actualizar y eliminar inventarios y productos asociados.
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo
    email: dev@tudominio.com

servers:
  - url: http://localhost:8080
    description: Servidor local Spring Boot

tags:
  - name: Inventarios
    description: Operaciones sobre inventarios
  - name: Productos
    description: Operaciones sobre productos

# ==========================================
# PATHS
# ==========================================
paths:

  /inv:
    post:
      tags: [Inventarios]
      summary: Crear inventario
      description: Crea un nuevo inventario en el sistema.
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '201':
          description: Inventario creado correctamente
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Inventarios]
      summary: Listar inventarios
      description: Devuelve todos los inventarios con sus productos.
      operationId: getAllInventories
      responses:
        '200':
          description: Lista de inventarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /inv/{inventory_id}:
    parameters:
      - name: inventory_id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Inventarios]
      summary: Obtener inventario por ID
      operationId: getInventoryById
      responses:
        '200':
          description: Inventario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Inventarios]
      summary: Actualizar inventario
      operationId: updateInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '200':
          description: Inventario actualizado
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Inventarios]
      summary: Eliminar inventario
      operationId: deleteInventory
      responses:
        '200':
          description: Inventario eliminado
        '404':
          $ref: '#/components/responses/NotFoundError'

  /products:
    get:
      tags: [Productos]
      summary: Listar productos
      operationId: getAllProducts
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'

  /products/{inventory_id}:
    post:
      tags: [Productos]
      summary: Crear producto en inventario
      operationId: addProductToInventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Producto creado
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /products/{inventory_id}/{product_id}:
    parameters:
      - name: inventory_id
        in: path
        required: true
        schema:
          type: integer
      - name: product_id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Productos]
      summary: Obtener producto
      operationId: getProductByIdAndInventory
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Productos]
      summary: Actualizar producto
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Producto actualizado
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Productos]
      summary: Eliminar producto
      operationId: deleteProduct
      responses:
        '200':
          description: Producto eliminado
        '404':
          $ref: '#/components/responses/NotFoundError'

# ==========================================
# COMPONENTS
# ==========================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NotFoundError:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Recurso no encontrado"

    BadRequestError:
      description: Petición incorrecta
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Datos inválidos"

    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Error interno"

  schemas:

    InventoryDto:
      type: object
      required:
        - name
        - products
      properties:
        name:
          type: string
          example: "Ferretería"
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'

    ProductDto:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: "Manzanas"
        price:
          type: number
          format: float
          minimum: 0
          example: 2.5
        weight:
          type: number
          format: float
          example: 1.0

    Inventory:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Frutería"

    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "Naranjas"
        price:
          type: number
          format: float
          minimum: 0
          example: 3.2
        weight:
          type: number
          format: float
          example: 2.5