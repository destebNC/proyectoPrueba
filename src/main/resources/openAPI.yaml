openapi: 3.0.3
security:
  - bearerAuth: []
info:
  title: Inventory Management API (Enhanced Version)
  description: |
    RESTful API for inventory and product management.
    Allows creating, querying, updating and deleting inventories and associated products.
  version: 1.0.0
  contact:
    name: Development Team
    email: dev@yourdomain.com

servers:
  - url: http://localhost:8080
    description: Local Spring Boot server

tags:
  - name: Authentication
    description: User authentication operations
  - name: Inventories
    description: Inventory operations
  - name: Products
    description: Product operations

# ==========================================
# PATHS
# ==========================================
paths:

  /auth/login:
    post:
      tags: [ Authentication ]
      summary: User login
      description: Returns a valid JWT to access the API
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
  /inv:
    post:
      tags: [Inventories]
      summary: Create inventory
      description: Creates a new inventory in the system.
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '201':
          description: Inventory created successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Inventories]
      summary: List inventories
      description: Returns all inventories with their products.
      operationId: getAllInventories
      responses:
        '200':
          description: List of inventories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryDto'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /inv/{inventory_id}:
    parameters:
      - name: inventory_id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Inventories]
      summary: Get inventory by ID
      operationId: getInventoryById
      responses:
        '200':
          description: Inventory found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Inventories]
      summary: Update inventory
      operationId: updateInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '200':
          description: Inventory updated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Inventories]
      summary: Delete inventory
      operationId: deleteInventory
      responses:
        '200':
          description: Inventory deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: getAllProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'

  /products/{inventory_id}:
    post:
      tags: [Products]
      summary: Create product in inventory
      operationId: addProductToInventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Product created
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /products/{inventory_id}/{product_id}:
    parameters:
      - name: inventory_id
        in: path
        required: true
        schema:
          type: integer
      - name: product_id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [Products]
      summary: Get product
      operationId: getProductByIdAndInventory
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Products]
      summary: Update product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Products]
      summary: Delete product
      operationId: deleteProduct
      responses:
        '200':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFoundError'

# ==========================================
# COMPONENTS
# ==========================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Resource not found"

    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Invalid data"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Internal error"

  schemas:

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: 1234

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    InventoryDto:
      type: object
      required:
        - name
        - products
      properties:
        name:
          type: string
          example: "Hardware Store"
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'

    ProductDto:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: "Apples"
        price:
          type: number
          format: float
          minimum: 0
          example: 2.5
        weight:
          type: number
          format: float
          example: 1.0

    Inventory:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Grocery Store"

    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "Oranges"
        price:
          type: number
          format: float
          minimum: 0
          example: 3.2
        weight:
          type: number
          format: float
          example: 2.5