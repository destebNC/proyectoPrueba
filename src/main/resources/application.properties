spring.application.name=supermercado-api

# Perfil por defecto: dev (H2 en memoria, no necesita instalar nada).
# Para usar MySQL: SPRING_PROFILES_ACTIVE=mysql
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Swagger UI muestra el contrato escrito a mano (src/main/resources/static/openapi.yaml)
springdoc.swagger-ui.url=/openapi.yaml

# JWT: en produccion define JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:solo-para-desarrollo-cambiame-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Datos iniciales: usuarios demo y, si la BD esta vacia, inventarios de ejemplo
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.user-username=${DEMO_USER_USERNAME:user}
app.seed.user-password=${DEMO_USER_PASSWORD:user123}
