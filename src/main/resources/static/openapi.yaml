openapi: 3.0.3
info:
  title: Inventory Management API
  description: RESTful API for inventory and product management, secured with JWT.
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Inventories
  - name: Products

paths:
  /auth/register:
    post:
      tags: [ Authentication ]
      summary: User registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      tags: [ Authentication ]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK

  /api/inv:
    post:
      tags: [ Inventories ]
      summary: Create inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '200':
          description: OK
  /api/inv/paginated:
    get:
      tags: [ Inventories ]
      summary: List inventories (Paginated)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
  /api/inv/{id}:
    delete:
      tags: [ Inventories ]
      summary: Delete inventory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /api/productos:
    get:
      tags: [ Products ]
      summary: List all products
      responses:
        '200':
          description: OK
    post:
      tags: [ Products ]
      summary: Add standalone product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK

  /api/productos/paginated:
    get:
      tags: [ Products ]
      summary: List all products (Paginated)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK

  /api/productos/{product_id}:
    get:
      tags: [ Products ]
      summary: Get product by ID
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

  /api/productos/inv/{inventory_id}:
    post:
      tags: [ Products ]
      summary: Add product to specific inventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK

  /api/productos/inv/{inventory_id}/paginated:
    get:
      tags: [ Products ]
      summary: List products from inventory (Paginated)
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK

  /api/productos/inv/{inventory_id}/{product_id}:
    put:
      tags: [ Products ]
      summary: Update product in inventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
        - name: product_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK
    delete:
      tags: [ Products ]
      summary: Delete product from inventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
        - name: product_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
        role: { type: string }
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
    Product:
      type: object
      required: [name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number, format: double }
        weight: { type: number, format: double }
    ProductDto:
      type: object
      properties:
        name: { type: string }
        price: { type: number, format: double }
        weight: { type: number, format: double }
    Inventory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }