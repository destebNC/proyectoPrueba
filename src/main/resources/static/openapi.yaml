openapi: 3.0.3
info:
  title: Inventory Management API
  description: RESTful API for inventory and product management, secured with JWT.
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Inventories
  - name: Products

paths:
  /auth/register:
    post:
      tags: [ Authentication ]
      summary: User registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [ Authentication ]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/inv:
    post:
      tags: [ Inventories ]
      summary: Create inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/inv/paginated:
    get:
      tags: [ Inventories ]
      summary: List inventories (Paginated)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/inv/{id}:
    delete:
      tags: [ Inventories ]
      summary: Delete inventory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/productos:
    get:
      tags: [ Products ]
      summary: List all products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Products ]
      summary: Add standalone product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/productos/paginated:
    get:
      tags: [ Products ]
      summary: List all products (Paginated)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/productos/{product_id}:
    get:
      tags: [ Products ]
      summary: Get product by ID
      parameters:
        - name: product_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/productos/inv/{inventory_id}:
    post:
      tags: [ Products ]
      summary: Add product to specific inventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/productos/inv/{inventory_id}/paginated:
    get:
      tags: [ Products ]
      summary: List products from inventory (Paginated)
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/productos/inv/{inventory_id}/{product_id}:
    put:
      tags: [ Products ]
      summary: Update product in inventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
        - name: product_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Products ]
      summary: Delete product from inventory
      parameters:
        - name: inventory_id
          in: path
          required: true
          schema: { type: integer }
        - name: product_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:

    BadRequest:
      description: Invalid request

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: Unauthorized

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: Resource not found

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Conflict

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProblemDetail:
      type: object

      properties:
        type:
          type: string
          example: about:blank

        title:
          type: string
          example: Resource not found

        status:
          type: integer
          example: 404

        detail:
          type: string
          example: Product with id 10 not found

        instance:
          type: string
          example: /api/productos/10
    RegisterRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
        role: { type: string }
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
    Product:
      type: object
      required: [name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number, format: double }
        weight: { type: number, format: double }
    ProductDto:
      type: object
      properties:
        name: { type: string }
        price: { type: number, format: double }
        weight: { type: number, format: double }
    Inventory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }