openapi: 3.0.3
info:
  title: Inventory Management API (Enhanced Version)
  description: |
    RESTful API for inventory and product management.
    Now secured with JWT Authentication.
  version: 1.0.0
  contact:
    name: Development Team
    email: dev@yourdomain.com

servers:
  - url: http://localhost:8080
    description: Local Spring Boot server

# Aplica el candado a toda la API por defecto
security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication and registration
  - name: Inventories
    description: Inventory operations
  - name: Products
    description: Product operations

# ==========================================
# PATHS
# ==========================================
paths:

  /auth/register:
    post:
      tags: [ Authentication ]
      summary: User registration
      description: Registers a new user in the system
      operationId: registerUser
      security: [] # Anula la seguridad para que cualquiera pueda registrarse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/login:
    post:
      tags: [ Authentication ]
      summary: User login
      description: Returns a valid JWT to access the API
      operationId: login
      security: [] # Anula la seguridad para que cualquiera pueda hacer login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials

  /api/inv:
    post:
      tags: [ Inventories ]
      summary: Create inventory
      description: Creates a new inventory (ADMIN only).
      operationId: createInventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inventory'
      responses:
        '200':
          description: Inventory created successfully
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ProblemDetailError'

  /api/inv/paginated:
    get:
      tags: [ Inventories ]
      summary: List inventories (Paginated)
      description: Returns inventories using pagination.
      operationId: getPaginatedInventories
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated list of inventories

  /api/inv/{inventory_id}:
    parameters:
      - name: inventory_id
        in: path
        required: true
        schema:
          type: integer

    get:
      tags: [ Inventories ]
      summary: Get inventory by ID
      operationId: getInventoryById
      responses:
        '200':
          description: Inventory found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
        '404':
          $ref: '#/components/responses/ProblemDetailError'

    delete:
      tags: [ Inventories ]
      summary: Delete inventory
      operationId: deleteInventory
      responses:
        '200':
          description: Inventory deleted
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ProblemDetailError'

  /api/productos:
    get:
      tags: [ Products ]
      summary: List products
      operationId: getAllProducts
      responses:
        '200':
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
    post:
      tags: [ Products ]
      summary: Add a standalone product
      operationId: addProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product added
          content:
            text/plain:
              schema:
                type: string

# ==========================================
# COMPONENTS
# ==========================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ProblemDetailError:
      description: Standard Spring ProblemDetail Error (RFC 7807)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              instance:
                type: string

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: 1234
        role:
          type: string
          example: ADMIN

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: 1234

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    InventoryDto:
      type: object
      required:
        - name
        - products
      properties:
        name:
          type: string
          example: "Main Warehouse"
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'

    ProductDto:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: "Apples"
        price:
          type: number
          format: double
          minimum: 0
          example: 2.5
        weight:
          type: number
          format: double
          example: 1.0

    Inventory:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Main Warehouse"

    Product:
      type: object
      required:
        - name
        - price
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "Oranges"
        price:
          type: number
          format: double
          minimum: 0
          example: 3.2
        weight:
          type: number
          format: double
          example: 2.5