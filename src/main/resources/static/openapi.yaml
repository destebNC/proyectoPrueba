openapi: 3.0.3
info:
  title: Supermercado API
  description: |
    RESTful API for supermarket inventory and product management, secured with JWT.

    1. Get a token with `POST /auth/login` (demo users: `admin`/`admin123` and `user`/`user123`)
       or create a USER account with `POST /auth/register`.
    2. Send it in every request as `Authorization: Bearer <token>`.

    Roles: managing inventories (`/api/inventories`) requires ADMIN; products
    (`/api/products` and `/api/inventories/{inventoryId}/products`) require ADMIN or USER.
    Errors follow RFC 7807 (`application/problem+json`).
  version: 2.0.0

servers:
  - url: /
    description: Same server that serves this document
  - url: http://localhost:8080
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Inventories
    description: Only role ADMIN
  - name: Products
    description: Roles ADMIN and USER

paths:
  /auth/register:
    post:
      tags: [ Authentication ]
      operationId: register
      summary: User registration (always role USER)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created; returns a token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [ Authentication ]
      operationId: login
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyAttempts'

  /api/inventories:
    get:
      tags: [ Inventories ]
      operationId: listInventories
      summary: List inventories (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ Inventories ]
      operationId: createInventory
      summary: Create inventory (optionally with products)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [ Inventories ]
      operationId: getInventory
      summary: Get inventory by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Inventories ]
      operationId: updateInventory
      summary: Rename inventory (products are ignored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Inventories ]
      operationId: deleteInventory
      summary: Delete inventory and its products
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/inventories/{inventoryId}/products:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    get:
      tags: [ Products ]
      operationId: listInventoryProducts
      summary: List products of an inventory (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Products ]
      operationId: addProductToInventory
      summary: Add product to an inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/inventories/{inventoryId}/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [ Products ]
      operationId: updateInventoryProduct
      summary: Update product of an inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Products ]
      operationId: deleteInventoryProduct
      summary: Delete product of an inventory
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/products:
    get:
      tags: [ Products ]
      operationId: listProducts
      summary: List all products (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Products ]
      operationId: createProduct
      summary: Create a product without inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/products/{id}:
    get:
      tags: [ Products ]
      operationId: getProduct
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: Page number (starts at 0)
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (max 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    InventoryId:
      name: inventoryId
      in: path
      required: true
      schema: { type: integer }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing/invalid token or wrong credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated but without the required role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyAttempts:
      description: Too many failed login attempts, the user is blocked for 15 minutes
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Recurso no encontrado
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: El producto con ID 10 no existe
        instance:
          type: string
          example: /api/products/10
        errors:
          type: array
          description: Field errors (only for validation errors)
          items:
            type: string

    RegisterRequest:
      type: object
      required: [ username, password ]
      properties:
        username: { type: string, minLength: 3, maxLength: 50, example: pepe }
        password: { type: string, minLength: 6, maxLength: 100, example: secreto1 }

    LoginRequest:
      type: object
      required: [ username, password ]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: admin123 }

    TokenResponse:
      type: object
      properties:
        token: { type: string }

    ProductDto:
      type: object
      required: [ name, price ]
      properties:
        id: { type: integer, readOnly: true, nullable: true }
        name: { type: string, maxLength: 100, example: Leche entera 1L }
        price: { type: number, format: double, exclusiveMinimum: true, minimum: 0, example: 0.95 }
        weight: { type: number, format: double, minimum: 0, nullable: true, example: 1.03 }
        inventoryId:
          type: integer
          readOnly: true
          nullable: true
          description: Inventory the product belongs to (null for standalone products)

    InventoryDto:
      type: object
      required: [ name ]
      properties:
        id: { type: integer, readOnly: true, nullable: true }
        name: { type: string, maxLength: 100, example: Almacen Madrid }
        products:
          type: array
          maxItems: 100
          nullable: true
          items:
            $ref: '#/components/schemas/ProductDto'

    # Pagina de Spring Data. Las propiedades se repiten en ProductPage e InventoryPage
    # porque el validador de contrato no admite bien allOf.
    ProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductDto'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer, description: Current page (0-based) }
        size: { type: integer }
        numberOfElements: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
        pageable: { type: object }
        sort: { type: object }

    InventoryPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InventoryDto'
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer, description: Current page (0-based) }
        size: { type: integer }
        numberOfElements: { type: integer }
        first: { type: boolean }
        last: { type: boolean }
        empty: { type: boolean }
        pageable: { type: object }
        sort: { type: object }
