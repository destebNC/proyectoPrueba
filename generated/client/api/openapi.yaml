openapi: 3.0.3
info:
  contact:
    email: dev@tudominio.com
    name: Equipo de Desarrollo
  description: |
    API RESTful para la gestión de inventarios y productos.
    Permite crear, consultar, actualizar y eliminar inventarios y productos asociados.
  title: API de Gestión de Inventarios (Versión Mejorada)
  version: 1.0.0
servers:
- description: Servidor local Spring Boot
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- description: Operaciones sobre inventarios
  name: Inventarios
- description: Operaciones sobre productos
  name: Productos
paths:
  /auth/login:
    post:
      description: Devuelve un JWT válido para acceder a la API
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Token generado correctamente
        "401":
          description: Credenciales incorrectas
      summary: Login de usuario
      tags:
      - Autenticación
      x-content-type: application/json
      x-accepts:
      - application/json
  /inv:
    get:
      description: Devuelve todos los inventarios con sus productos.
      operationId: getAllInventories
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/InventoryDto"
                type: array
          description: Lista de inventarios
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAllInventories_500_response"
          description: Error interno del servidor
      summary: Listar inventarios
      tags:
      - Inventarios
      x-accepts:
      - application/json
    post:
      description: Crea un nuevo inventario en el sistema.
      operationId: createInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Inventory"
        required: true
      responses:
        "201":
          description: Inventario creado correctamente
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInventory_400_response"
          description: Petición incorrecta
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getAllInventories_500_response"
          description: Error interno del servidor
      summary: Crear inventario
      tags:
      - Inventarios
      x-content-type: application/json
      x-accepts:
      - application/json
  /inv/{inventory_id}:
    delete:
      operationId: deleteInventory
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          description: Inventario eliminado
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Eliminar inventario
      tags:
      - Inventarios
      x-accepts:
      - application/json
    get:
      operationId: getInventoryById
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryDto"
          description: Inventario encontrado
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Obtener inventario por ID
      tags:
      - Inventarios
      x-accepts:
      - application/json
    put:
      operationId: updateInventory
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Inventory"
        required: true
      responses:
        "200":
          description: Inventario actualizado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInventory_400_response"
          description: Petición incorrecta
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Actualizar inventario
      tags:
      - Inventarios
      x-content-type: application/json
      x-accepts:
      - application/json
  /products:
    get:
      operationId: getAllProducts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProductDto"
                type: array
          description: Lista de productos
      summary: Listar productos
      tags:
      - Productos
      x-accepts:
      - application/json
  /products/{inventory_id}:
    post:
      operationId: addProductToInventory
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDto"
        required: true
      responses:
        "201":
          description: Producto creado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createInventory_400_response"
          description: Petición incorrecta
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Crear producto en inventario
      tags:
      - Productos
      x-content-type: application/json
      x-accepts:
      - application/json
  /products/{inventory_id}/{product_id}:
    delete:
      operationId: deleteProduct
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      - explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          description: Producto eliminado
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Eliminar producto
      tags:
      - Productos
      x-accepts:
      - application/json
    get:
      operationId: getProductByIdAndInventory
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      - explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
          description: Producto encontrado
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Obtener producto
      tags:
      - Productos
      x-accepts:
      - application/json
    put:
      operationId: updateProduct
      parameters:
      - explode: false
        in: path
        name: inventory_id
        required: true
        schema:
          type: integer
        style: simple
      - explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
        required: true
      responses:
        "200":
          description: Producto actualizado
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getInventoryById_404_response"
          description: Recurso no encontrado
      summary: Actualizar producto
      tags:
      - Productos
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  responses:
    NotFoundError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/getInventoryById_404_response"
      description: Recurso no encontrado
    BadRequestError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/createInventory_400_response"
      description: Petición incorrecta
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/getAllInventories_500_response"
      description: Error interno del servidor
  schemas:
    LoginRequest:
      example:
        password: "1234"
        username: admin
      properties:
        username:
          example: admin
          type: string
        password:
          example: "1234"
          type: string
      required:
      - password
      - username
      type: object
    TokenResponse:
      example:
        token: eyJhbGciOiJIUzI1NiIs...
      properties:
        token:
          example: eyJhbGciOiJIUzI1NiIs...
          type: string
      type: object
    InventoryDto:
      example:
        name: Ferretería
        products:
        - price: 2.5
          name: Manzanas
          weight: 1.0
        - price: 2.5
          name: Manzanas
          weight: 1.0
      properties:
        name:
          example: Ferretería
          type: string
        products:
          items:
            $ref: "#/components/schemas/ProductDto"
          type: array
      required:
      - name
      - products
      type: object
    ProductDto:
      example:
        price: 2.5
        name: Manzanas
        weight: 1.0
      properties:
        name:
          example: Manzanas
          type: string
        price:
          example: 2.5
          format: float
          minimum: 0
          type: number
        weight:
          example: 1.0
          format: float
          type: number
      required:
      - name
      - price
      type: object
    Inventory:
      example:
        name: Frutería
        id: 1
      properties:
        id:
          example: 1
          type: integer
        name:
          example: Frutería
          type: string
      required:
      - name
      type: object
    Product:
      example:
        price: 3.2
        name: Naranjas
        weight: 2.5
        id: 10
      properties:
        id:
          example: 10
          type: integer
        name:
          example: Naranjas
          type: string
        price:
          example: 3.2
          format: float
          minimum: 0
          type: number
        weight:
          example: 2.5
          format: float
          type: number
      required:
      - name
      - price
      type: object
    getAllInventories_500_response:
      example:
        message: Error interno
      properties:
        message:
          example: Error interno
          type: string
      type: object
    createInventory_400_response:
      example:
        message: Datos inválidos
      properties:
        message:
          example: Datos inválidos
          type: string
      type: object
    getInventoryById_404_response:
      example:
        message: Recurso no encontrado
      properties:
        message:
          example: Recurso no encontrado
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http

