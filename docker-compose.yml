version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_DATABASE: proyecto_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user_prueba
      MYSQL_PASSWORD: password_prueba
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: