openapi: 3.0.1
info:
  title: API de Inventario - Fase 2
  description: Gestión de productos de supermercado siguiendo el estándar Contract-First y RFC 7807.
  version: 1.0.0
  # Corregimos el aviso 'info-contact'
  contact:
    name: Soporte Técnico API
    email: soporte@ejemplo.com

# Corregimos los avisos 'operation-tag-defined' (Presentamos la etiqueta oficialmente)
tags:
  - name: Productos
    description: Operaciones relacionadas con el inventario de la tienda.

servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo

paths:
  /agregar:
    post:
      tags:
        - Productos
      summary: Crear nuevo producto
      description: Registra un nuevo producto en la base de datos de inventario.
      operationId: agregarProducto
      requestBody:
        description: Objeto producto que se va a guardar
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
        required: true
      responses:
        "200":
          description: Producto creado con éxito
          content:
            application/json:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /productos:
    get:
      tags:
        - Productos
      summary: Listar inventario
      description: Retorna todos los productos registrados actualmente.
      operationId: listarProductos
      responses:
        "200":
          description: Lista de productos obtenida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductDto"

  /productos/{product_id}:
    get:
      tags:
        - Productos
      summary: Buscar por ID
      description: Obtiene los detalles de un producto específico mediante su identificador.
      operationId: buscarProductoPorId
      parameters:
        - name: product_id
          in: path
          required: true
          description: Identificador único del producto
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDto"
        "404":
          $ref: "#/components/responses/NotFound"

  /delete/{product_id}:
    delete:
      tags:
        - Productos
      summary: Eliminar producto
      description: Elimina un producto de forma permanente mediante su ID.
      operationId: borrarProducto
      parameters:
        - name: product_id
          in: path
          required: true
          description: ID del producto a borrar
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Producto eliminado
          content:
            application/json:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Product:
      type: object
      required: [name, price]
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        name:
          type: string
          example: "Manzana"
        price:
          type: number
          format: float
          example: 1.50
        weight:
          type: number
          format: float
          example: 0.5

    ProductDto:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
          format: float

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: Error de validación en la petición.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Error interno del servidor.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"