name: Validacion Continua API

# Cuándo se ejecuta este robot:
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Usamos Windows en el servidor de GitHub porque tu proyecto usa "oasdiff.exe"
    runs-on: windows-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v3

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Ejecutar el Quality Gate (Validación Total)
        run: ./mvnw clean verify